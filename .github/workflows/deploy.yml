name: Deploy to Netlify

# Builds here instead of on Netlify's own CI, so pushes/merges to main don't
# spend Netlify's monthly build quota. Netlify itself should have "Stop
# builds" enabled in its dashboard (Site configuration → Build & deploy →
# Continuous deployment) so it doesn't also try to build the same push —
# that toggle lives on Netlify's side and can't be set from this repo.
#
# `netlify deploy --no-build` uploads the already-built dist/ and functions
# straight to the existing site (same domain, same Functions, same
# netlify.toml redirects/headers) without asking Netlify to run a build of
# its own, which is what actually consumes build minutes/count.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: netlify-deploy
  cancel-in-progress: false

jobs:
  deploy:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        env:
          # Vite bakes VITE_* vars into the client bundle at build time, not
          # at deploy time — Netlify's own build used to inject these
          # automatically from its Site configuration → Environment
          # variables. Building on GitHub Actions instead means they have to
          # be repeated here as repo secrets, or the shipped bundle throws
          # "Missing Supabase env vars" on load (src/lib/supabase.ts reads
          # these at import time and has no fallback).
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_STARTER_PRICE_ID: ${{ secrets.VITE_STRIPE_STARTER_PRICE_ID }}
          VITE_STRIPE_STARTER_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_STARTER_YEARLY_PRICE_ID }}
          VITE_STRIPE_SOLO_PRICE_ID: ${{ secrets.VITE_STRIPE_SOLO_PRICE_ID }}
          VITE_STRIPE_SOLO_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_SOLO_YEARLY_PRICE_ID }}
          VITE_STRIPE_GROWTH_PRICE_ID: ${{ secrets.VITE_STRIPE_GROWTH_PRICE_ID }}
          VITE_STRIPE_GROWTH_YEARLY_PRICE_ID: ${{ secrets.VITE_STRIPE_GROWTH_YEARLY_PRICE_ID }}
          VITE_STRIPE_CREDITS_20: ${{ secrets.VITE_STRIPE_CREDITS_20 }}
          VITE_STRIPE_CREDITS_50: ${{ secrets.VITE_STRIPE_CREDITS_50 }}
          VITE_STRIPE_CREDITS_120: ${{ secrets.VITE_STRIPE_CREDITS_120 }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --prod --no-build --dir=dist
